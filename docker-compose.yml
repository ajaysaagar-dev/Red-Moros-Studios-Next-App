services:
  redmoros-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redmoros-app
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
    env_file:
      - path: .env
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
